name: Static site (GitHub Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build static site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: npm --prefix web ci
      - name: Build static site
        # PUBLIC_BASE_PATH mirrors the GitHub Pages project-site base (/<repo>).
        run: PUBLIC_BASE_PATH=/${{ github.event.repository.name }} npm --prefix web run build:static
      - name: Ensure .nojekyll
        run: touch "$(find web/dist -maxdepth 2 -type d -name _astro | head -1 | xargs dirname)/.nojekyll"
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist/client

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
