name: ccar-p

services:
  database:
    image: postgres:18.1-alpine3.23
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ccarp}
      POSTGRES_USER: ${POSTGRES_USER:-ccarp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - database-data:/var/lib/postgresql/data
    networks:
      - private
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    environment:
      APP_ENV: ${APP_ENV:-development}
      HTTP_ADDR: :8080
      DATABASE_URL: postgres://${POSTGRES_USER:-ccarp}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB:-ccarp}?sslmode=disable
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET}
      MCP_SERVICE_TOKEN_HASH: ${MCP_SERVICE_TOKEN_HASH:-}
      MCP_CONTENT_AUTHOR_ID: ${MCP_CONTENT_AUTHOR_ID:-}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:4321}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:4321}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
      SEED_ADMIN_DISPLAY_NAME: ${SEED_ADMIN_DISPLAY_NAME:-}
    networks:
      - private
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/readyz"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    environment:
      BACKEND_URL: http://backend:8080
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:4321}
      HOST: 0.0.0.0
      PORT: 4321
    ports:
      - "${FRONTEND_PORT:-4321}:4321"
    networks:
      - private
      - public
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:4321/health"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    restart: unless-stopped

networks:
  private:
    internal: true
  public:

volumes:
  database-data:
